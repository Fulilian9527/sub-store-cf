name: "Daily Force Sync at 2AM"

on:
  schedule:
    # 每天北京/新加坡时间凌晨 02:00 运行 (对应 UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 保留手动触发按钮，方便随时测试

env:
  # 消除 Node.js 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Project 1
        run: |
          # 克隆原项目（自动拉取默认分支，无论是 master 还是 main）
          git clone --depth=1 https://github.com/sub-store-org/Sub-Store.git temp_p1
          # 清空并覆盖文件夹
          rm -rf Sub-Store/*
          cp -rn temp_p1/* Sub-Store/
          rm -rf temp_p1

      - name: Sync Project 2
        run: |
          git clone --depth=1 https://github.com/Yu9191/sub-store-workers.git temp_p2
          rm -rf sub-store-workers/*
          cp -rn temp_p2/* sub-store-workers/
          rm -rf temp_p2

          # 3. 👇 核心步骤：自动注入你的私人配置
          # 替换 KV ID
          sed -i 's/你的KV命名空间ID/890fe93c5a984a43ba82c9c2fe26a51d/g' sub-store-workers/wrangler.toml
          
          # 替换或追加后端路径环境变量 (如果 wrangler.toml 里没有 [vars]，我们直接在末尾追加)
          echo -e "\n[vars]\nSUB_STORE_FRONTEND_BACKEND_PATH = \"/Glsg9514JAgfYFJ\"" >> sub-store-workers/wrangler.toml

      - name: Commit and Push
        run: |
          git add .
          # 只有检测到实际文件变化时才提交
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "每日定时同步：已更新至原仓库最新版本"
            git push
          else
            echo "今日无新代码，跳过同步"
          fi
